
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhvani AI - Complete Media Production House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2; --primary-hover: #9a4be9;
            --background: #121212; --surface: #1e1e1e; --surface-light: #282828;
            --text: #ffffff; --text-secondary: #b3b3b3; --border: #2d2d2d;
            --green: #4CAF50; --green-hover: #5cb85c;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1, h2 { text-align: center; } h1 { color: var(--primary); font-size: 3em; } h2 { font-weight: 400; opacity: 0.8; margin-top: -15px; }
        #wizard { background: var(--surface); padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        #status { display: none; text-align: center; margin: 20px; padding: 15px; background: var(--surface-light); border-radius: 8px; }
        button { background: var(--primary); color: white; padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; transition: background-color 0.2s; }
        button:hover { background: var(--primary-hover); }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #album-art-display { text-align: center; margin-bottom: 30px; display: none; }
        #album-art-image { max-width: 400px; width: 100%; border-radius: 12px; border: 2px solid var(--border); }
        #mixing-desk { background: var(--surface); border-radius: 12px; padding: 20px; display: none; }
        .master-controls { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px; border-bottom: 2px solid var(--primary); }
        #master-play-pause { font-size: 1.5em; padding: 15px 30px; }
        #download-master-button { font-size: 1.2em; padding: 12px 25px; background-color: var(--green); }
        #download-master-button:hover { background-color: var(--green-hover); }
        .stem-track { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dhvani AI</h1>
        <h2>The Complete Media Production House</h2>
        <div id="status"></div>
        <div id="wizard">...</div>
        <div id="album-art-display">...</div>

        <div id="mixing-desk">
            <div class="master-controls">
                <button id="master-play-pause">Play</button>
                <button id="download-master-button" onclick="downloadMaster()">Download Final Mix</button>
            </div>
            <div id="track-container">...</div>
        </div>
    </div>

    <script>
        // Functions to control UI, like nextStep, prevStep, etc.

        function setupStem(name, url) { ... }
        function generateMusic() { ... }

        async function downloadMaster() {
            const statusDiv = document.getElementById('status');
            const downloadButton = document.getElementById('download-master-button');
            statusDiv.textContent = 'Preparing for mastering...';
            statusDiv.style.display = 'block';
            downloadButton.disabled = true;
            downloadButton.textContent = 'Mastering...';

            try {
                const stems = {};
                ['vocals', 'drums', 'bass', 'other', 'instrumental'].forEach(name => {
                    const trackElement = document.getElementById(`track-${name}`);
                    if (trackElement && trackElement.style.display !== 'none' && trackElement.dataset.originalUrl) {
                        stems[name] = {
                            url: trackElement.dataset.originalUrl,
                            volume: document.getElementById(`volume-${name}`).value
                        };
                    }
                });

                let signature = null;
                const signatureTrack = document.getElementById('track-signature');
                if (signatureTrack && signatureTrack.style.display !== 'none' && signatureTrack.dataset.originalUrl) {
                    signature = { url: signatureTrack.dataset.originalUrl };
                }

                const response = await fetch('/master', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stems, signature })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Mastering failed on server.');
                }

                statusDiv.textContent = 'Mastering complete! Download will begin shortly.';
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = 'Dhvani_AI_Masterpiece.mp3';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                a.remove();

                setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);

            } catch (error) {
                statusDiv.textContent = `Error during mastering: ${error.message}`;
            } finally {
                downloadButton.disabled = false;
                downloadButton.textContent = 'Download Final Mix';
            }
        }
    </script>
</body>
</html>
