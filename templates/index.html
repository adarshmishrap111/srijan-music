<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijan Music World - Advanced AI Music Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1, h2, h3 {
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .wizard-step { display: none; }
        .wizard-step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-container { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background-color: #2a9fd6; color: white; font-size: 16px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2180b0; }
        button.rec { background-color: #d62a2a; }
        button.rec:hover { background-color: #b02121; }
        audio { width: 100%; margin-top: 20px; border-radius: 25px; }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 16px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            color: #f0f0f0;
            box-sizing: border-box;
        }
        select { -webkit-appearance: none; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: .65em auto; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        .slider-container { padding: 10px 0; }
        .slider { -webkit-appearance: none; width: 100%; height: 10px; background: rgba(0,0,0,0.3); border-radius: 5px; outline: none; transition: opacity .2s; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #2a9fd6; cursor: pointer; border-radius: 50%; }
        .slider::-moz-range-thumb { width: 20px; height: 20px; background: #2a9fd6; cursor: pointer; border-radius: 50%; }
        .slider-value { text-align: center; margin-top: 5px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider.round { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider.round:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider.round { background-color: #2196F3; }
        input:checked + .slider.round:before { transform: translateX(26px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Srijan Music World</h1>
        <h2>Your Advanced AI Music Creation Studio</h2>
        <audio id="audioPlayer" controls style="display: none;"></audio>
        <p id="generation-status" style="text-align: center;"></p>
        <div id="wizard">
            <!-- Step 1: Mood & Story -->
            <div class="wizard-step active" id="step1">...</div>

            <!-- Step 2: Jazbaat (Emotional Tuning) -->
            <div class="wizard-step" id="step2">...</div>

            <!-- Step 3: Musical Style -->
            <div class="wizard-step" id="step3">...</div>

            <!-- Step 4: The Voice -->
            <div class="wizard-step" id="step4">
                <h3>Step 4: The Voice</h3>
                <div class="control-group">
                    <label for="artist">Select Singer Persona</label>
                    <select id="artist" name="artist">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="kid">Kid</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Or, Record Your Own Voice</label>
                    <button id="recordButton">Record Voice</button>
                    <p id="recording-status"></p>
                    <audio id="recordedAudioPlayer" controls style="display:none;"></audio>
                </div>
                <div class="btn-container"><button onclick="prevStep()">Previous</button><button onclick="nextStep()">Next</button></div>
            </div>

            <!-- Step 5: Generate -->
            <div class="wizard-step" id="step5">...</div>
        </div>
    </div>

    <script>
        // Wizard navigation and other functions from before ...
        let currentStep = 1;
        const wizard = document.getElementById('wizard');
        const steps = wizard.getElementsByClassName('wizard-step');

        function showStep(step) {
            for (let i = 0; i < steps.length; i++) {
                steps[i].classList.remove('active');
            }
            steps[step - 1].classList.add('active');
        }

        function nextStep() {
            if (currentStep < steps.length) {
                currentStep++;
                showStep(currentStep);
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
            }
        }
        
        function toggleJugalbandi() {
            const jugalbandiInstrument = document.getElementById('jugalbandi-instrument');
            jugalbandiInstrument.style.display = document.getElementById('jugalbandiToggle').checked ? 'block' : 'none';
        }

        document.getElementById('mithaas').oninput = function() { document.getElementById('mithaasValue').innerHTML = this.value; }
        document.getElementById('dard').oninput = function() { document.getElementById('dardValue').innerHTML = this.value; }

        // --- Voice Recording Logic ---
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioURL = '';

        const recordButton = document.getElementById('recordButton');
        const recordingStatus = document.getElementById('recording-status');
        const recordedAudioPlayer = document.getElementById('recordedAudioPlayer');

        recordButton.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordButton.textContent = 'Record Voice';
                recordButton.classList.remove('rec');
                recordingStatus.textContent = 'Recording stopped. Processing...';
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        recordedAudioURL = URL.createObjectURL(audioBlob);
                        recordedAudioPlayer.src = recordedAudioURL;
                        recordedAudioPlayer.style.display = 'block';
                        recordingStatus.textContent = 'Recording complete! You can play it back or re-record.';
                        uploadRecordedVoice(audioBlob);
                    };

                    mediaRecorder.start();
                    recordButton.textContent = 'Stop Recording';
                    recordButton.classList.add('rec');
                    recordingStatus.textContent = 'Recording... Speak into your microphone.';
                } catch (err) {
                    console.error('Error accessing microphone:', err);
                    recordingStatus.textContent = 'Could not access microphone. Please grant permission and try again.';
                }
            }
        });

        function uploadRecordedVoice(audioBlob) {
            const formData = new FormData();
            formData.append('audio_data', audioBlob, 'recorded_voice.wav');
            
            recordingStatus.textContent = 'Uploading voice sample...';

            fetch('/upload_voice', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.error) throw new Error(data.error);
                console.log('Upload successful:', data);
                recordingStatus.textContent = `Voice sample uploaded successfully! File: ${data.path}`;
            })
            .catch(error => {
                console.error('Error uploading voice:', error);
                recordingStatus.textContent = `Upload failed: ${error.message}`;
            });
        }
        
        function generateMusic() { /* ... existing function ... */ }

        showStep(currentStep);
    </script>
</body>
</html>
