<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijan Music World - AI Music Generation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1, h2, h3 {
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .wizard-step {
            display: none;
        }
        .wizard-step.active {
            display: block;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 25px;
            background: rgba(0,0,0,0.2);
        }
        textarea {
            width: 95%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 16px;
            margin-bottom: 20px;
            height: 120px;
            background: rgba(0,0,0,0.3);
            color: #f0f0f0;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Srijan Music World</h1>
        <h2>Your AI-Powered Music Creation Studio</h2>

        <audio id="audioPlayer" controls></audio>

        <div id="wizard">
            <div class="wizard-step active" id="step1">
                <h3>Step 1: Mood & Story</h3>
                <textarea id="lyrics" placeholder="Enter your lyrics here..."></textarea>
                 <div class="control-group">
                    <label for="emotion">Select Emotion</label>
                    <select id="emotion" name="emotion">
                        <option value="happy">Happy</option>
                        <option value="sad">Sad</option>
                        <option value="calm">Calm</option>
                        <option value="motivational">Motivational</option>
                        <option value="classical">Classical</option>
                    </select>
                </div>
                <div class="btn-container">
                    <button onclick="nextStep()">Next</button>
                </div>
            </div>

            <div class="wizard-step" id="step2">
                <h3>Step 2: Musical Style</h3>
                <div class="control-group">
                    <label for="language">Select Language/Style</label>
                    <select id="language" name="language">
                        <option value="bhojpuri">Bhojpuri</option>
                        <option value="hindi">Hindi</option>
                        <option value="punjabi">Punjabi</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="instrument">Select Instrument</label>
                    <select id="instrument" name="instrument">
                        <option value="auto">Auto</option>
                        <option value="piano">Piano</option>
                        <option value="guitar">Guitar</option>
                        <option value="violin">Violin</option>
                        <option value="flute">Flute</option>
                        <option value="sitar">Sitar</option>
                        <option value="santoor">Santoor</option>
                        <option value="harmonium">Harmonium</option>
                        <option value="sarod">Sarod</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="raga">Select Raga (Optional)</label>
                    <select id="raga" name="raga">
                        <option value="none">None</option>
                        <option value="yaman">Raga Yaman</option>
                        <option value="bhairav">Raga Bhairav</option>
                        <option value="bageshri">Raga Bageshri</option>
                    </select>
                </div>
                <div class="btn-container">
                    <button onclick="prevStep()">Previous</button>
                    <button onclick="nextStep()">Next</button>
                </div>
            </div>

            <div class="wizard-step" id="step3">
                <h3>Step 3: The Voice</h3>
                <div class="control-group">
                    <label for="artist">Select Singer</label>
                    <select id="artist" name="artist">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="kid">Kid</option>
                    </select>
                </div>
                 <div class="control-group">
                    <button id="recordButton">Start Recording</button>
                    <p id="recording-status"></p>
                </div>
                <div class="btn-container">
                    <button onclick="prevStep()">Previous</button>
                    <button onclick="nextStep()">Next</button>
                </div>
            </div>

            <div class="wizard-step" id="step4">
                <h3>Step 4: Generate</h3>
                 <p>You're all set! Click the button below to generate your masterpiece.</p>
                <div class="btn-container">
                    <button onclick="prevStep()">Previous</button>
                    <button onclick="generateMusic()">Generate Music</button>
                </div>
                <p id="generation-status"></p>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const wizard = document.getElementById('wizard');
        const steps = wizard.getElementsByClassName('wizard-step');

        function showStep(step) {
            for (let i = 0; i < steps.length; i++) {
                steps[i].classList.remove('active');
            }
            steps[step - 1].classList.add('active');
        }

        function nextStep() {
            if (currentStep < steps.length) {
                currentStep++;
                showStep(currentStep);
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
            }
        }

        function generateMusic() {
            const emotion = document.getElementById('emotion').value;
            const language = document.getElementById('language').value;
            const instrument = document.getElementById('instrument').value;
            const raga = document.getElementById('raga').value;
            const artist = document.getElementById('artist').value;
            const lyrics = document.getElementById('lyrics').value;

            const generationStatus = document.getElementById('generation-status');
            generationStatus.textContent = 'Generating music... please wait.';

            const url = `/generate?emotion=${emotion}&language=${language}&instrument=${instrument}&raga=${raga}&artist=${artist}&lyrics=${encodeURIComponent(lyrics)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if(data.error) throw new Error(data.error);
                    generationStatus.textContent = 'Playing generated music!';
                    const audioPlayer = document.getElementById('audioPlayer');
                    audioPlayer.src = data.melody_path;
                    audioPlayer.play();
                })
                .catch(error => {
                    console.error('Error generating music:', error);
                    generationStatus.textContent = 'Error generating music.';
                });
        }

        showStep(currentStep);
    </script>
</body>
</html>
